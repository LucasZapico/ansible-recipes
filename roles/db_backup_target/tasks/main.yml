---
- name: Require at least one source
  ansible.builtin.assert:
    that:
      - db_backup_target_sources | length > 0
    fail_msg: db_backup_target_sources is empty; nothing would be authorised.

- name: Ensure each source's backup directory exists
  ansible.builtin.file:
    path: "{{ item.dir }}"
    state: directory
    owner: "{{ db_backup_target_user }}"
    mode: "0750"
  loop: "{{ db_backup_target_sources }}"
  become: true

- name: Authorise each source's backup key, restricted to its backup dir
  ansible.posix.authorized_key:
    user: "{{ db_backup_target_user }}"
    key: "{{ hostvars[item.host].db_backup_pubkey }}"
    # No shell, no forwarding: the key exists only to rsync into the backup
    # tree. rrsync (shipped with rsync) confines it to that one directory.
    key_options: >-
      restrict,command="rrsync {{ item.dir }}"
    state: present
  loop: "{{ db_backup_target_sources }}"
  become: true
  when: hostvars[item.host].db_backup_pubkey is defined

- name: Install the offsite prune script
  ansible.builtin.template:
    src: db-backup-prune.sh.j2
    dest: /usr/local/bin/db-backup-prune.sh
    owner: root
    mode: "0755"
  become: true

- name: Install the prune service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    mode: "0644"
  loop:
    - db-backup-prune.service
    - db-backup-prune.timer
  become: true
  notify: Reload systemd (db_backup_target)

- name: Flush handlers so the units are loaded before enabling the timer
  ansible.builtin.meta: flush_handlers

- name: Enable and start the daily prune timer
  ansible.builtin.systemd_service:
    name: db-backup-prune.timer
    enabled: true
    state: started
  become: true
