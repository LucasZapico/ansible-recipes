---
- name: Ensure keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Tailscale package signing key
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/{{ tailscale_apt_track }}/{{ ansible_facts['distribution'] | lower }}/{{ tailscale_apt_suite }}.noarmor.gpg"
    dest: /etc/apt/keyrings/tailscale-archive-keyring.gpg
    mode: "0644"

# Own the whole sources file (see the docker role for why line-appends
# conflict with pre-existing repo definitions).
- name: Write tailscale apt source
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/tailscale.list
    mode: "0644"
    content: >
      deb [signed-by=/etc/apt/keyrings/tailscale-archive-keyring.gpg]
      https://pkgs.tailscale.com/{{ tailscale_apt_track }}/{{ ansible_facts['distribution'] | lower }}
      {{ tailscale_apt_suite }} main
  register: tailscale_apt_source

# Skipped when --check has not really written the apt source: the repo is not
# in apt's cache and this reports "No package matching 'tailscale'", which
# describes check mode rather than the host.
- name: Install tailscale
  ansible.builtin.apt:
    name: tailscale
    state: latest
    update_cache: true
  when: not (ansible_check_mode and tailscale_apt_source is changed)

- name: Enable and start tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started
  when: not (ansible_check_mode and tailscale_apt_source is changed)
