---
- name: Install zsh
  ansible.builtin.apt:
    name: zsh
    state: present

- name: Ensure zsh is a registered shell
  ansible.builtin.lineinfile:
    path: /etc/shells
    line: /usr/bin/zsh
    state: present

- name: Set zsh as default shell for {{ base_shell_user }}
  ansible.builtin.user:
    name: "{{ base_shell_user }}"
    shell: /usr/bin/zsh

- name: Install oh-my-zsh
  ansible.builtin.git:
    repo: https://github.com/ohmyzsh/ohmyzsh.git
    dest: "~{{ base_shell_user }}/.oh-my-zsh"
    version: master
    depth: 1
    update: false
  become: true
  become_user: "{{ base_shell_user }}"

# Cloning the repo is not the whole install. Upstream's install.sh has a
# separate setup_zshrc() step that copies templates/zshrc.zsh-template into
# place; the clone alone leaves the template unused, so zsh finds no startup
# files and runs zsh-newuser-install on every login of a freshly built host.
#
# A plain copy is faithful to upstream here: setup_zshrc() only transforms the
# `export ZSH=` line, and at the default clone path that substitution resolves
# to the value already in the template ($HOME/.oh-my-zsh), making it a no-op.
#
# force: false is what keeps this safe on adopted machines - an existing
# .zshrc is never touched, the file is only created when absent.
- name: Install the oh-my-zsh .zshrc (only when the user has none)
  ansible.builtin.copy:
    src: "~{{ base_shell_user }}/.oh-my-zsh/templates/zshrc.zsh-template"
    dest: "~{{ base_shell_user }}/.zshrc"
    remote_src: true
    force: false
    mode: "0644"
  become: true
  become_user: "{{ base_shell_user }}"

# No longer gated on a prior stat: the task above guarantees .zshrc exists.
- name: Set custom prompt
  ansible.builtin.lineinfile:
    path: "~{{ base_shell_user }}/.zshrc"
    line: "{{ base_zsh_prompt }}"
    state: present
  when: base_zsh_prompt | length > 0
