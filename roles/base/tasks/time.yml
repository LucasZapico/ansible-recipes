---
- name: Set timezone
  community.general.timezone:
    name: "{{ base_timezone }}"

- name: Ensure timesyncd drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/timesyncd.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# Written before the service is started so a fresh host syncs against the
# intended servers on its first boot, not against whatever DHCP offered.
- name: Pin NTP servers for systemd-timesyncd
  ansible.builtin.template:
    src: timesyncd-ntp.conf.j2
    dest: /etc/systemd/timesyncd.conf.d/10-ntp-servers.conf
    owner: root
    group: root
    mode: "0644"
  when: base_ntp_servers | length > 0
  notify: Restart timesyncd

- name: Enable NTP sync (systemd-timesyncd)
  ansible.builtin.systemd:
    name: systemd-timesyncd
    enabled: true
    state: started
  register: base_timesyncd
  failed_when:
    - base_timesyncd is failed
    - "'Could not find the requested service' not in (base_timesyncd.msg | default(''))"
