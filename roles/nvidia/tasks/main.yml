---
- name: Detect an NVIDIA GPU
  ansible.builtin.shell: |
    set -o pipefail
    lspci | grep -ci 'nvidia' || true
  args:
    executable: /bin/bash
  register: nvidia_present
  changed_when: false
  check_mode: false   # read-only probe; must run under --check or the assert below fires on nothing

- name: Require a GPU before touching drivers
  ansible.builtin.assert:
    that: nvidia_present.stdout | int > 0
    fail_msg: >-
      No NVIDIA device found by lspci. This role is in the host's play list but
      the hardware is not here - check the inventory group rather than
      installing a driver that cannot bind to anything.

# --- driver -----------------------------------------------------------------
# The role will not choose a driver for you. It used to fall back to
# `ubuntu-drivers install --gpgpu`, which selects the SERVER/datacenter variant
# - on a consumer RTX 4090 that is not what ubuntu-drivers itself recommends
# (nvidia-driver-595-open), and the host it was run on did not survive its next
# reboot. The cause was never proven, but a role that silently picks a different
# package than the tool's own recommendation is not something to keep.
#
# Run `ubuntu-drivers devices` on the host and pin what it marks recommended.
- name: Require an explicit driver package
  ansible.builtin.assert:
    that: nvidia_driver_package | length > 0
    fail_msg: >-
      nvidia_driver_package is not set. Run `ubuntu-drivers devices` on this
      host and pin the package it marks "recommended" (for example
      nvidia-driver-595-open). This role deliberately does not guess.

- name: Install the pinned driver package
  ansible.builtin.apt:
    name: "{{ nvidia_driver_package }}"
    state: present
    update_cache: true
  register: nvidia_driver_install

# --- container toolkit ------------------------------------------------------
- name: Container toolkit
  when: nvidia_container_toolkit
  block:
    - name: Ensure keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add the NVIDIA container toolkit signing key
      ansible.builtin.get_url:
        url: https://nvidia.github.io/libnvidia-container/gpgkey
        dest: /etc/apt/keyrings/nvidia-container-toolkit.asc
        mode: "0644"

    # Own the whole sources file rather than appending, for the same reason the
    # docker and cloudflared roles do: a second entry for the same repo with a
    # different signed-by makes apt refuse every source on the host.
    - name: Write the toolkit apt source
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/nvidia-container-toolkit.list
        mode: "0644"
        content: >
          deb [signed-by=/etc/apt/keyrings/nvidia-container-toolkit.asc]
          https://nvidia.github.io/libnvidia-container/stable/deb/$(ARCH) /
      register: nvidia_toolkit_source

    # In check mode the source file above was not really written, so the package
    # cannot be in apt's cache and the install reports "no package matching
    # nvidia-container-toolkit" - a failure describing check mode, not the host.
    # Same guard the beszel_agent role uses for the same reason.
    - name: Install nvidia-container-toolkit
      ansible.builtin.apt:
        name: nvidia-container-toolkit
        state: present
        update_cache: true
      when: not (ansible_check_mode and nvidia_toolkit_source is changed)

# --- initramfs, checked BEFORE any reboot -----------------------------------
# Installing a driver triggers a dkms build and an initramfs rebuild. If that
# image loses the hooks needed to assemble the root device, the host boots to
# "No working init found" and there is no way back in over ssh. This is the
# check that turns that into a failed play while the machine is still up.
- name: Find the root device type
  ansible.builtin.shell: |
    set -o pipefail
    lsblk -no TYPE "$(findmnt -no SOURCE /)" | head -1
  args:
    executable: /bin/bash
  register: nvidia_root_type
  changed_when: false
  check_mode: false

- name: Check the initramfs can still assemble an LVM root
  ansible.builtin.shell: |
    set -o pipefail
    lsinitramfs /boot/initrd.img-{{ ansible_kernel }} | grep -c lvm
  args:
    executable: /bin/bash
  register: nvidia_initramfs_lvm
  changed_when: false
  failed_when: false
  check_mode: false
  when: nvidia_root_type.stdout | trim == 'lvm'

- name: Refuse to leave the host unbootable
  ansible.builtin.assert:
    that: nvidia_initramfs_lvm.stdout | default('0') | int > 0
    fail_msg: >-
      The initramfs for {{ ansible_kernel }} no longer contains the LVM hooks,
      and root is on LVM. Rebooting now would panic with "No working init
      found". Rebuild it with
      `update-initramfs -c -k {{ ansible_kernel }}` and re-run BEFORE rebooting.
  when:
    - nvidia_root_type.stdout | trim == 'lvm'
    - not ansible_check_mode

# --- verification -----------------------------------------------------------
# No docker restart handler here on purpose. This role runs BEFORE the docker
# role, because declaring the nvidia runtime in daemon.json while
# /usr/bin/nvidia-container-runtime is absent stops the daemon from starting at
# all. The docker role restarts on its own when daemon.json changes.
# Package presence is not proof. A driver that has not bound to the card, or a
# runtime docker does not know about, both install cleanly and then fail at the
# only moment that matters.
- name: Does the driver actually see the card?
  ansible.builtin.command: nvidia-smi --query-gpu=name,driver_version --format=csv,noheader
  register: nvidia_smi
  changed_when: false
  failed_when: false
  check_mode: false   # ditto: without this, --check always reports the driver broken

# Guarded for check mode: nothing was installed there, so a missing nvidia-smi
# describes --check rather than the host. The probe above still runs and
# reports, which is the useful part of a dry run.
- name: Report when a reboot is required
  ansible.builtin.assert:
    that: nvidia_smi.rc == 0
    fail_msg: >-
      nvidia-smi failed ({{ nvidia_smi.stderr | default('') | trim }}). The
      driver is installed but not bound to the card, which normally means the
      host needs a reboot to load the kernel module. Reboot the host and
      re-converge; this role will not reboot a server on its own.
  when: not ansible_check_mode

- name: Show the GPU
  ansible.builtin.debug:
    msg: "GPU: {{ nvidia_smi.stdout | trim }}"
  when: nvidia_smi.rc == 0
