---
# Weekly broken-link check for the sites we run, from a host that is not the
# web server. See README.md for the shape of site_links_sites.

# Mondays, early morning UTC, after the weekend's content edits.
site_links_on_calendar: "Mon *-*-* 14:30:00"
site_links_state_dir: /var/lib/site-links
# Reports kept per site: twelve weekly runs, a quarter, enough to see a trend.
site_links_keep: 12
site_links_script_dir: /usr/local/lib/site-links

# Each site:
#   name:        what the alert calls it ("bhreco")
#   base_url:    the address to check, https://…
#   canonical:   hosts that are the same site under another name, e.g. the
#                future domain a sitemap is written for (list, optional)
#   sitemap:     path of the sitemap on base_url (default /sitemap.xml)
#   ntfy_url:    topic to report to (each site reports to its own topic)
#   ntfy_token:  write token for that topic; ntfy runs deny-all, so without one
#                every report is refused with 403 and nothing arrives
#   slack_webhook: optional. A Slack incoming webhook that hears only when a
#                run finds dead links or closed places; the all-clear stays
#                on ntfy.
#   places:      optional. Also ask Google whether each business the site lists
#                is still open (files/check-places.mjs), after the link check.
#                  source:      URL of a JSON list of places (an array, or
#                               Directus's {data: [...]}) with name and
#                               google_place_id
#                  near:        where to search for a place with no ID
#                               ("Bellingham, WA")
#                  google_key:  a Places API (New) key
site_links_sites: []
